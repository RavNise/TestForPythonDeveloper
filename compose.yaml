services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.22
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    mem_limit: 1g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  api:
    build: .
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      DATABASE_PATH: /data/documents.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - db_data:/data
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  es_data:
  db_data: